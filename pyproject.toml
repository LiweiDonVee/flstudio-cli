[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flstudio-cli"
version = "0.5.2"
description = "Independent FL Studio project composing, inspection and native rendering CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["click>=8.1,<9", "pydantic>=2.10,<3"]

[project.optional-dependencies]
midi = ["mido>=1.3,<2", "python-rtmidi>=1.5,<2"]

[project.urls]
Repository = "https://github.com/LiweiDonVee/flstudio-cli"
Issues = "https://github.com/LiweiDonVee/flstudio-cli/issues"

[project.scripts]
flstudio = "flstudio_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.hatch.build.targets.wheel]
packages = ["src/flstudio_cli"]
